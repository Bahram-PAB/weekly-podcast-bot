# Filters
filters:
  exclude_keywords:
    - "کلاس"
    - "دوره"
    - "آموزش"
    - "ثبت نام"
    - "هزینه"
    - "شهریه"
    - "تور"
    - "سفر"
    - "طبیعت گردی"
    - "گردشگری"
  min_caption_length: 50
  # Minimum views to consider a post (prevents viral spam from unknown channels)
  min_views: 10
  # Max top posts per channel
  top_posts_per_channel: 2

# Priority channels — always included even if low views
priority_channels:
  - "@koohnameh"
  - "@kouheghaf"
  - "@havashenasihashemnezhad"
  - "@Climbing_news"
  - "@podbasecamp"
  - "@Mang_halat"

